services:

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: blogistdb
      POSTGRES_USER: blogistuser
      POSTGRES_PASSWORD: blogistpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blogistuser -d blogistdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./services/auth-service
    ports:
      - "8001:8001"
    environment:
      SECRET_KEY: django-insecure-blogist-auth-secret-key-change-in-prod
      DEBUG: "True"
      DB_NAME: blogistdb
      DB_USER: blogistuser
      DB_PASSWORD: blogistpassword
      DB_HOST: db
      DB_PORT: 5432
      EMAIL_BACKEND: ${EMAIL_BACKEND:-}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Blogist <noreply@blogist.io>}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8001"
    restart: on-failure

  post-service:
    build: ./services/post-service
    ports:
      - "8002:8002"
    environment:
      SECRET_KEY: django-insecure-blogist-auth-secret-key-change-in-prod
      DEBUG: "True"
      DB_NAME: blogistdb
      DB_USER: blogistuser
      DB_PASSWORD: blogistpassword
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "sleep 10 &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8002"
    restart: on-failure

  comment-service:
    build: ./services/comment-service
    ports:
      - "8003:8003"
    environment:
      SECRET_KEY: django-insecure-blogist-auth-secret-key-change-in-prod
      DEBUG: "True"
      DB_NAME: blogistdb
      DB_USER: blogistuser
      DB_PASSWORD: blogistpassword
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "sleep 20 &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8003"
    restart: on-failure

  ai-service:
    build: ./services/ai-service
    ports:
      - "8004:8004"
    environment:
      SECRET_KEY: django-insecure-blogist-auth-secret-key-change-in-prod
      DEBUG: "True"
      DB_NAME: blogistdb
      DB_USER: blogistuser
      DB_PASSWORD: blogistpassword
      DB_HOST: db
      DB_PORT: 5432
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "sleep 30 &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8004"
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_AUTH_URL: http://auth-service:8001
      VITE_POST_URL: http://post-service:8002
      VITE_COMMENT_URL: http://comment-service:8003
      VITE_AI_URL: http://ai-service:8004
    depends_on:
      - auth-service
      - post-service
      - comment-service
      - ai-service
volumes:
  postgres_data:
